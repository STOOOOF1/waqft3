<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>بطاقات اقتصاديات الوقف والعمل الخيري</title>

<style>
:root{--ink:#14302f;--teal:#0f5c5a;--teal2:#1b7f7a;--tealL:#e3f1ef;--gold:#b8892f;--goldL:#f7efdc;--rose:#9c3d3d;--gray:#5d6b6a;--line:#d6e6e3;--bg:#f3f8f7}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Tajawal,sans-serif;background:var(--bg);color:var(--ink);-webkit-tap-highlight-color:transparent}
.wrap{max-width:620px;margin:0 auto;padding:14px 14px 40px}
header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
header h1{flex:1;font-size:19px;font-weight:900;color:var(--teal);line-height:1.3}
header h1 small{display:block;font-size:12.5px;font-weight:500;color:var(--gray)}
button{font-family:inherit;cursor:pointer}
.btn-menu{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-weight:700;color:var(--teal);font-size:14px}
.total{background:#fff;border-radius:14px;padding:10px 12px;border:1px solid var(--line);margin-bottom:10px}
.total .row{display:flex;justify-content:space-between;font-size:14px;font-weight:700;margin-bottom:6px}
.bar{height:8px;background:var(--tealL);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(to left,var(--gold),var(--teal2));border-radius:99px;transition:width .4s}
.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:8px}
.lv{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:8px 5px 7px;text-align:center;position:relative;color:var(--ink)}
.lv b{display:block;font-size:13.5px;color:var(--teal)}.lv span{display:block;font-size:12px;color:var(--gray);margin:2px 0 5px}
.lv .bar{height:5px}
.lv.on{border-color:var(--teal);background:var(--tealL)}
.lv .done{position:absolute;top:-7px;left:-5px;background:var(--gold);color:#fff;border-radius:99px;width:20px;height:20px;font-size:12px;line-height:20px;font-weight:900}
.share{text-align:center;margin-bottom:14px}
.share button{background:none;border:1px dashed var(--teal2);color:var(--teal);border-radius:10px;padding:6px 12px;font-weight:700;font-size:13.5px}
.share p{font-size:12px;color:var(--gray);margin-top:4px}
.card{background:#fff;border-radius:22px;box-shadow:0 6px 24px rgba(15,92,90,.10);overflow:hidden;animation:in .35s ease}
.card::before{content:"";display:block;height:6px;background:linear-gradient(to left,var(--gold),var(--teal2))}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card .meta{display:flex;justify-content:space-between;align-items:center;padding:14px 18px 0;font-size:13px;color:var(--gray)}
.card .ch{background:var(--goldL);color:#8a6420;border-radius:99px;padding:2px 10px;font-weight:700}
.card .isdone{color:var(--teal2);font-weight:700}
.card h2{font-size:21px;font-weight:900;color:var(--teal);padding:10px 18px 4px;line-height:1.45}
.card .body{padding:4px 18px 20px;font-size:16.5px;line-height:1.85}
.body ul,.body ol{padding-right:20px;margin:4px 0}.body li{margin-bottom:3px}
.body b{color:var(--teal)}
.body .k{background:var(--tealL);color:var(--teal);border-radius:6px;padding:0 6px;font-weight:700}
.body .v{color:#7a5a16;font-weight:700}
.body table{width:100%;border-collapse:collapse;font-size:14.5px;margin:6px 0;line-height:1.6}
.body th{background:var(--tealL);color:var(--teal);padding:5px 7px;text-align:right}
.body td{border-top:1px solid var(--line);padding:5px 7px;vertical-align:top}.body td:first-child{font-weight:700;color:var(--teal)}
.actions{display:flex;gap:8px;margin-top:14px}
#ok{flex:1;background:var(--teal);color:#fff;border:none;border-radius:16px;padding:15px;font-size:17px;font-weight:800}
#later{background:#fff;color:var(--teal);border:1.5px solid var(--line);border-radius:16px;padding:15px 18px;font-size:15px;font-weight:700}
.sub{display:flex;justify-content:space-between;margin-top:10px;font-size:13.5px;color:var(--gray)}
.sub a{color:var(--teal);font-weight:700;cursor:pointer;text-decoration:none}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--ink);color:#fff;border-radius:99px;padding:9px 20px;font-weight:700;transition:transform .3s;z-index:40;font-size:14.5px}
.toast.show{transform:translateX(-50%) translateY(0)}
.fin{background:#fff;border-radius:22px;padding:30px 20px;text-align:center;box-shadow:0 6px 24px rgba(15,92,90,.10);animation:in .35s}
.fin .big{font-size:54px}.fin h2{color:var(--teal);font-size:22px;margin:8px 0}.fin p{color:var(--gray);margin-bottom:16px;line-height:1.7}
.fin button{display:block;width:100%;margin-top:8px;border-radius:14px;padding:13px;font-size:16px;font-weight:800;border:1.5px solid var(--line);background:#fff;color:var(--teal)}
.fin button.pri{background:var(--teal);color:#fff;border:none}
.sheet-bg{position:fixed;inset:0;background:rgba(20,48,47,.45);display:none;z-index:30}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:620px;margin:0 auto;background:#fff;border-radius:22px 22px 0 0;max-height:80vh;overflow:auto;transform:translateY(100%);transition:transform .3s;z-index:31;padding:14px 14px 24px}
.sheet.open{transform:none}.sheet-bg.open{display:block}
.sheet h3{color:var(--teal);font-size:17px;margin-bottom:8px;display:flex;justify-content:space-between}
.sheet h3 button{background:none;border:none;font-size:20px;color:var(--gray)}
.it{display:flex;gap:8px;align-items:center;padding:9px 6px;border-bottom:1px solid var(--line);cursor:pointer;font-size:15px}
.it .st{width:22px;height:22px;border-radius:99px;border:1.5px solid var(--line);flex:none;text-align:center;font-size:13px;line-height:20px;color:#fff}
.it.d .st{background:var(--teal2);border-color:var(--teal2)}
.it.cur{background:var(--goldL);border-radius:8px}
.it small{color:var(--gray);margin-inline-start:auto;font-size:12px}
.reset{margin-top:12px;width:100%;background:#fff;border:1px solid var(--rose);color:var(--rose);border-radius:12px;padding:10px;font-weight:700}
.confirm{display:none;margin-top:8px;background:#fbefed;border-radius:12px;padding:10px;text-align:center;font-size:14px}
.confirm button{margin:6px 4px 0;border-radius:10px;padding:7px 16px;font-weight:700;border:1px solid var(--line);background:#fff}
.confirm button.y{background:var(--rose);color:#fff;border:none}
</style></head><body>

<script>
const COURSE={title:"اقتصاديات الوقف والعمل الخيري",slug:"waqf-econ"};
const LEVELS=[{n:1,name:"الصورة الكبرى"},{n:2,name:"المفاهيم"},{n:3,name:"التفاصيل"},{n:4,name:"الإتقان"}];
const C=[
// ===== المستوى 1 =====
[1,"س1","ما الوقف؟","الوقف هو <span class='k'>حبس الأصل وتسبيل المنفعة</span>: يبقى الأصل محفوظًا، وتذهب منافعه أو عوائده إلى جهات البر أو من يحددهم الواقف.<br>ميزته الكبرى <b>استمرارية الانتفاع</b>، فهو أداة مؤسسية تخدم أجيالًا متعاقبة."],
[1,"س1","لماذا يهتم الاقتصاد بالوقف؟","لأن الوقف <b>يعبّئ الموارد</b> ويوجّهها إلى التعليم والصحة والرعاية والمرافق، و<b>يخفف الضغط</b> على الإنفاق الحكومي، ويعزّز <b>التكافل</b> والاستقرار.<br>وهذا المقرر يربط الأحكام الشرعية للوقف بأدوات التحليل الاقتصادي."],
[1,"س2","على ماذا يقوم الوقف؟","على <b>أربعة أركان</b>: واقف يُنشئه، ومال موقوف، وموقوف عليه يستفيد، وصيغة تدل على الإنشاء.<br>ووضوح هذه الأحكام <b>يحمي الأصول</b> ويقلل النزاع ويضمن وصول العوائد إلى أغراضها."],
[1,"س5","الوقف آلية لتخصيص الموارد","يوجّه جزءًا من الثروات الخاصة إلى <b>المنافع العامة</b> بصورة مستدامة، فيسدّ احتياجات <b>يعجز السوق</b> عن توفيرها أو <b>تضيق الموازنات</b> عن تمويلها.<br>وهو يختلف عن التمويل التجاري (هدفه الربح) وعن الإنفاق الحكومي (مصدره الإيرادات العامة)."],
[1,"س6–س7","من يحكم الوقف ويديره؟","<b>شرط الواقف</b> يرسم الإطار: لمن تُصرف المنافع؟ وكيف يُدار المال؟<br>و<b>الناظر</b> هو من يتولى الإدارة الفعلية: يحفظ الأصول ويستثمرها ويحصّل الإيرادات ويصرفها وفق الشروط، ويُساءل عند التقصير."],
[1,"س10–س11","الوقف يتجدد بصيغ معاصرة","لم يعد الوقف عقارًا فقط؛ فهناك <b>وقف النقود والمنافع والوقف المؤقت</b>، و<b>وقف المنقولات والأسهم والصكوك والحقوق المعنوية</b>.<br>هذه الصيغ توسّع المشاركة وتنوّع الأصول، ولكل منها فرص وتحديات."],
[1,"س12–س14","استثمار الوقف وصناديقه","استثمار أموال الوقف وسيلة لتنميته، بشرط <b>التوازن بين المحافظة على الأصل وتنمية العائد</b>.<br>و<b>الصناديق الوقفية</b> تجمع المدخرات الصغيرة في رؤوس أموال كبيرة. وتُقاس الكفاءة بالعائد والمخاطر والسيولة والاستدامة والأثر."],
[1,"س15–س16","القطاع الثالث","هو قطاع المؤسسات <b>غير الربحية</b> التي تعمل خارج الحكومة وخارج الشركات الهادفة لتوزيع الأرباح، والأوقاف من مكوناته الأساسية.<br>ويحقق أفضل أثر حين <b>يتكامل</b> مع القطاعين العام والخاص."],
[1,"س17–س19","لماذا يعطي الناس؟ وكيف نحسن الإنفاق؟","دوافع العطاء <b>دينية واقتصادية واجتماعية وسلوكية</b>، وفهمها يساعد على تعبئة الموارد.<br>ثم يأتي <b>التوظيف الأمثل</b>: توجيه الموارد المحدودة (الندرة) إلى الاستخدامات الأعلى منفعة وبأقل تكلفة."],
[1,"س20–س30","الأثر التنموي للوقف","الوقف يسهم في <b>التكافل وإعادة التوزيع</b>، و<b>شبكة الأمان</b>، والآثار <b>الجزئية والكلية</b>، و<b>التنمية المستدامة</b>، ومعالجة <b>الفقر والبطالة</b>.<br>وكل ذلك يحتاج إلى قياس للأثر، ومؤسسات ناجحة، وعاملين أكفاء."],
// ===== المستوى 2 =====
[2,"س1","تعريف الوقف وحكمه","<b>التعريف:</b> حبس الأصل وتسبيل المنفعة؛ أي تخصيص مال قابل للانتفاع مع المحافظة على عينه، وتوجيه منافعه أو عوائده إلى جهات البر أو المستفيدين الذين يحددهم الواقف وفق الأحكام الشرعية.<br><b>الحكم:</b> <span class='k'>مشروع ومندوب إليه</span>."],
[2,"س1","أدلة مشروعية الوقف","استدل الفقهاء بـ:<ul><li><b>الكتاب:</b> آية آل عمران 92.</li><li><b>السنة:</b> حديث عمر في أرض خيبر، وحديث «إذا مات الإنسان...».</li><li><b>الإجماع.</b></li></ul>"],
[2,"س2","أركان الوقف الأربعة","<ol><li><b>الواقف</b>: الشخص الذي ينشئ الوقف.</li><li><b>الموقوف</b>: المال المخصص للوقف.</li><li><b>الموقوف عليه</b>: الجهة أو الشخص المستفيد.</li><li><b>الصيغة</b>: التعبير الدال على إنشاء الوقف.</li></ol>"],
[2,"س2","صيغة الوقف","تنعقد بـ:<ul><li><b>الألفاظ الصريحة</b>: «وقفتُ» و«حبستُ» و«سبّلتُ».</li><li><b>الألفاظ الكنائية</b> المصحوبة بما يدل على إرادة الوقف.</li></ul>وتختلف بعض تفاصيل الانعقاد باختلاف المذاهب."],
[2,"س3","تقسيمات الوقف","يُقسَّم الوقف باعتبارات أربعة:<ol><li>الجهة <b>المستفيدة</b>.</li><li>طبيعة <b>المال</b> الموقوف.</li><li><b>المدة</b>.</li><li>طريقة <b>الانتفاع</b>.</li></ol>وهذا التنوع يعكس مرونة المؤسسة الوقفية."],
[2,"س4","المقاصد الاقتصادية الست","<ol><li>حفظ المال واستدامة منافعه.</li><li>الكفاءة في تخصيص الموارد.</li><li>العدالة التوزيعية.</li><li>الاستقرار الاقتصادي.</li><li>تنمية رأس المال البشري.</li><li>تعزيز المسؤولية المجتمعية.</li></ol>"],
[2,"س6","شرط الواقف","<b>المفهوم:</b> ما يحدده منشئ الوقف من ضوابط تنظم إدارة المال واستثماره وتوزيع منافعه وتحديد المستفيدين.<br><b>الحكم:</b> يجب مراعاة الشروط الصحيحة الموافقة لمقتضى الوقف. وقاعدة <span class='k'>شرط الواقف كنص الشارع</span> معناها: مراعاة دلالات شروطه في الفهم والتفسير ضمن حدود الشريعة."],
[2,"س7","نظارة الوقف","<b>النظارة:</b> الولاية على إدارة الوقف ورعاية شؤونه: حفظ أصوله، واستثمار أمواله، وتحصيل إيراداته، وصرف منافعه وفق شرط الواقف والأحكام الشرعية.<br>ويتولاها <b>الناظر</b>، شخصًا طبيعيًا كان أو جهة مؤسسية."],
[2,"س8","الموقوف عليهم","هم <b>الأشخاص أو الجهات</b> التي يحددها الواقف لاستحقاق منافع الوقف أو عوائده.<br>وتحديدهم عنصر أساسي في تنظيم الوقف وضمان تحقيق أغراضه الشرعية والتنموية."],
[2,"س9","الشخصية الاعتبارية للوقف","الاعتراف للوقف بـ<b>كيان قانوني مستقل</b> له <span class='k'>ذمة مالية</span> وحقوق والتزامات، ويمثله الناظر أو الجهة المخوّلة بإدارته."],
[2,"س9","الوقف المعلّق والمقيّد","<b>المعلّق:</b> يربط الواقف <b>إنشاءه أو نفاذه</b> بتحقق أمر مستقبل. وقد اختلف الفقهاء في صحته.<br><b>المقيّد:</b> يربط الواقف <b>الانتفاع به أو إدارته</b> بشروط أو قيود محددة، وهي معتبرة في حدود مشروعيتها."],
[2,"س10","تعطّل الوقف واستبداله","<b>التعطّل:</b> توقف الانتفاع بالوقف أو تعذر تحقيق غرضه، لتلف الأصل أو تغير الظروف.<br><b>الاستبدال:</b> إحلال أصل آخر محل الأصل الموقوف وفق الضوابط الشرعية. واختلف الفقهاء في شروط جوازه."],
[2,"س10","وقف النقود والمنافع والوقف المؤقت","<ul><li><b>وقف النقود:</b> تخصيص مبلغ مالي يُستثمر وتوجَّه عوائده.</li><li><b>وقف المنافع:</b> تخصيص منفعة مال معين مع بقاء ملكية الأصل لصاحبه.</li><li><b>الوقف المؤقت:</b> تخصيص المال أو منفعته لمدة محددة ثم ينتهي.</li></ul>"],
[2,"س13","الوقف الجماعي والصناديق الوقفية","<b>الوقف الجماعي:</b> اشتراك عدد من الأفراد أو الجهات في إنشاء وقف واحد بمساهمات مالية أو عينية.<br><b>الصناديق الوقفية:</b> أوعية مؤسسية تُجمع فيها الأموال الوقفية وتُدار وتُستثمر وفق ضوابط شرعية وتنظيمية، وتوجَّه عوائدها للأغراض المحددة."],
[2,"س14","الكفاءة الاقتصادية للاستثمار الوقفي","قدرة المؤسسة الوقفية على توظيف أصولها لتحقيق <b>أفضل عائد ممكن</b> مع مراعاة المخاطر وحفظ الأصول واستدامة المنافع والتزام الشروط.<br>أبعاد تقييمها: <b>العائد · المخاطر · السيولة · الاستدامة المالية · الأثر التنموي · التقييم الشامل</b>."],
[2,"س15","القطاع الثالث","مجموعة المؤسسات التي تنشأ لتحقيق أهداف اجتماعية وتنموية وخيرية، وتعمل خارج <b>القطاع الحكومي</b> وخارج <b>المنشآت الهادفة لتوزيع الأرباح</b>.<br>ويُسمى أيضًا: <span class='k'>القطاع غير الربحي</span> أو <span class='k'>القطاع الأهلي</span>."],
[2,"س19","التوظيف الأمثل للموارد الخيرية","توجيه الأموال والأصول والموارد البشرية إلى الاستخدامات التي تحقق <b>أكبر منفعة ممكنة</b>، مع مراعاة الأهداف وشروط الواقفين واحتياجات المستفيدين.<br>ويرتبط بـ<span class='k'>مبدأ الندرة</span>: المفاضلة بين الاستخدامات البديلة للموارد المحدودة."],
[2,"س21","شبكة الأمان الاجتماعي","مجموعة البرامج والتدابير التي تحمي الأفراد والأسر من المخاطر الاقتصادية والاجتماعية، وتخفف آثار <b>الفقر والبطالة والمرض وفقدان الدخل</b>، بتقديم المساعدات والخدمات الأساسية للمحتاجين."],
[2,"س26","قياس الأثر","تقدير التغيرات التي تسهم أنشطة المؤسسات الوقفية والخيرية في إحداثها لدى المستفيدين والمجتمع، بمؤشرات <b>كمية ونوعية</b> وأساليب تقييم علمية، بما يحسّن تخصيص الموارد ويرفع كفاءة البرامج."],
[2,"س26","المخرجات والنتائج والآثار","<ul><li><b>المخرجات المباشرة:</b> المنتجات والخدمات الناتجة عن الأنشطة.</li><li><b>النتائج:</b> التغيرات لدى المستفيدين بعد تلقي الخدمة.</li><li><b>الآثار بعيدة المدى:</b> التغيرات الاقتصادية والاجتماعية المستمرة.</li></ul>"],
// ===== المستوى 3 =====
[3,"س1","الوظيفة الاقتصادية للوقف","<ul><li>تعبئة الموارد وتخصيصها للخدمات العامة والاجتماعية.</li><li>دعم التعليم والصحة وتخفيف الفقر.</li><li>استقرار التمويل الاجتماعي.</li><li>إعادة توزيع المنافع الاقتصادية.</li><li>تخفيف الضغوط على الإنفاق الحكومي.</li><li>توسيع المشاركة المجتمعية في التنمية.</li></ul>"],
[3,"س1","الوظيفة الاجتماعية للوقف","يعزز قيم <b>التكافل والتضامن والمسؤولية المشتركة</b>، ويقوّي الروابط الاجتماعية، ويضمن استدامة الخدمات الموجهة للمحتاجين.<br>وبذلك يحقق مقاصد الشريعة في <b>حفظ المال</b> و<b>تحقيق المصالح العامة</b>."],
[3,"س2","شروط كل ركن","<table><tr><th>الركن</th><th>شرطه</th></tr><tr><td>الواقف</td><td>أهلية التبرع والتصرف المالي</td></tr><tr><td>الموقوف</td><td>مال متقوّم معلوم يُنتفع به على وجه معتبر شرعًا</td></tr><tr><td>الموقوف عليه</td><td>جهة انتفاع مشروعة</td></tr><tr><td>الصيغة</td><td>تدل على إنشاء الوقف وإرادة التخصيص</td></tr></table>"],
[3,"س2","شروط صحة الوقف","<ol><li>صدوره عن شخص مؤهل للتبرع.</li><li>المال الموقوف <b>معلوم ومملوك</b> للواقف.</li><li>الانتفاع به <b>مشروع</b>.</li><li>الجهة المستفيدة محددة بصورة معتبرة شرعًا.</li><li>مراعاة أحكام <b>التأبيد والتوقيت</b> وفق الخلاف الفقهي.</li></ol>"],
[3,"س2","لماذا تهم أحكام الأركان اقتصاديًا؟","<ul><li>تحدد الحقوق والالتزامات.</li><li>تحمي الأصول الوقفية.</li><li>تحد من المنازعات وتعزز استقرار التصرفات.</li><li>تحسّن الحوكمة وكفاءة الإدارة.</li><li>تضمن توجيه العوائد للأغراض المحددة.</li><li>تقلل مخاطر سوء الاستخدام.</li></ul>"],
[3,"س3","الأنواع باعتبار المستفيد ووظائفها","<table><tr><th>النوع</th><th>لمن؟</th><th>وظيفته</th></tr><tr><td>الخيري</td><td>جهات البر والمصلحة العامة</td><td>الخدمات الاجتماعية والتنمية البشرية وإعادة التوزيع</td></tr><tr><td>الأهلي (الذري)</td><td>الأسرة والذرية وفق الشروط</td><td>الاستقرار المالي والحماية الاقتصادية للأسر</td></tr><tr><td>المشترك</td><td>يجمع بينهما</td><td>توزيع المنافع بين المحددين وجهات البر</td></tr></table>"],
[3,"س4","المقاصد 1–3 وترجمتها","<table><tr><th>المقصد</th><th>يُترجم إلى</th></tr><tr><td>حفظ المال (يستند إلى حبس الأصل وتسبيل المنفعة)</td><td>المحافظة على الأصول وتنميتها واستمرار تدفق العوائد</td></tr><tr><td>الكفاءة في التخصيص (توجيه المنافع للأغراض المشروعة)</td><td>تمويل الاحتياجات ذات الأولوية وتحسين كفاءة الاستخدام</td></tr><tr><td>العدالة التوزيعية (التكافل والإحسان)</td><td>إعادة توزيع المنافع وتوسيع الخدمات الأساسية وتخفيف التفاوت</td></tr></table>"],
[3,"س4","المقاصد 4–6 وترجمتها","<table><tr><th>المقصد</th><th>يُترجم إلى</th></tr><tr><td>الاستقرار الاقتصادي (استمرارية الوقف)</td><td>مصادر تمويل مستقرة نسبيًا والحد من تقلب الموارد</td></tr><tr><td>رأس المال البشري (خدمة المصالح العامة)</td><td>تمويل التعليم والصحة والتأهيل ورفع الإنتاجية</td></tr><tr><td>المسؤولية المجتمعية (مشروعية البذل التطوعي)</td><td>تعبئة الموارد الخاصة لتمويل التنمية</td></tr></table>"],
[3,"س5","مقارنة: الهدف والمصدر","<table><tr><th></th><th>الهدف</th><th>المصدر</th></tr><tr><td>الوقف</td><td>منافع محددة للمستفيدين (ويمكن استثمار أصوله)</td><td>أصول يخصصها الواقفون</td></tr><tr><td>التمويل التجاري</td><td>عوائد مالية للمستثمرين</td><td>رؤوس أموال المستثمرين</td></tr><tr><td>الإنفاق الحكومي</td><td>تنفيذ السياسات العامة</td><td>الإيرادات العامة</td></tr></table>"],
[3,"س5","مقارنة: أساس التخصيص والأهمية التنموية","<b>أساس التخصيص:</b> الوقف ← شروط الواقفين · التجاري ← الربحية والمخاطر والطلب الفعّال · الحكومي ← السياسات والموازنات العامة.<br>لذلك يُعد الوقف <span class='k'>مصدرًا تمويليًا مؤسسيًا مستقلًا نسبيًا</span>.<br><b>الأهمية التنموية:</b> تنويع مصادر تمويل الخدمات، وتخفيف أعباء الموازنة، وتعزيز مشاركة المجتمع."],
[3,"س6","الأثر الاقتصادي لشروط الواقفين","الشروط الواضحة تسهم في:<ul><li>تحديد أولويات الإنفاق.</li><li>تنظيم الصلاحيات والمسؤوليات.</li><li>حماية الأصول والحد من النزاعات.</li><li>استقرار السياسات الاستثمارية.</li><li>توجيه العوائد نحو المستفيدين والأغراض المحددة.</li></ul>"],
[3,"س7","أحكام النظارة وشروط الناظر","<ul><li>تثبت النظارة بما يحدده <b>الواقف</b> أو <b>الجهة المختصة</b>.</li><li>شروط الناظر: <span class='k'>الأهلية والأمانة والكفاية والقدرة</span>.</li><li>يلتزم بالمحافظة على أموال الوقف ومراعاة الشروط.</li><li>يخضع للمساءلة عند <b>التعدي أو التفريط</b>.</li></ul>"],
[3,"س7","مسؤوليات الناظر","<ol><li>إدارة الأصول الوقفية وصيانتها.</li><li>تنمية إيراداتها.</li><li>تنفيذ شروط الواقفين.</li><li>توزيع العوائد على المستحقين.</li><li>إعداد السجلات والتقارير المالية.</li><li>إدارة المخاطر.</li><li>حماية حقوق المستفيدين.</li></ol>"],
[3,"س8","أحكام الموقوف عليهم","<ul><li>جهة الانتفاع <b>مشروعة</b>.</li><li>المستفيدون محددون أو <b>قابلون للتحديد</b>.</li><li>قد يكونون أشخاصًا معينين (الذرية والأقارب) أو جهات عامة (الفقراء وطلاب العلم والمؤسسات الصحية).</li><li>التزام شروط الاستحقاق وترتيب المستفيدين وحصصهم.</li><li>مراعاة أحكام انقطاع المستحقين أو تعذر الانتفاع.</li></ul>"],
[3,"س8","العدالة في توزيع المنافع","تتحقق بإيصال المنافع للمستحقين وفق شروط الواقف، واعتماد <b>معايير موضوعية</b> عند وجود صلاحية للتوزيع:<ul><li>مستوى الدخل.</li><li>الحالة الاجتماعية.</li><li>حجم الحاجة.</li><li>مدى الاستفادة المتوقعة.</li></ul>"],
[3,"س9","ما تتيحه الشخصية الاعتبارية","<ul><li>تنظيم ملكية الأصول الوقفية.</li><li>إبرام العقود وإدارة الاستثمارات.</li><li>التقاضي.</li><li><b>الفصل</b> بين أموال الوقف وأموال القائمين عليه.</li></ul>وآثارها: استقلال مالي، ووضوح المسؤوليات، وحماية الأصول، وتحسين الحوكمة والمساءلة."],
[3,"س12","الأسس الشرعية لاستثمار الوقف","<ul><li>مشروعية الأنشطة والأدوات.</li><li>المحافظة على أموال الوقف.</li><li>مراعاة شروط الواقفين.</li><li>تحقيق المصلحة الوقفية.</li><li>تجنب المخاطر المفرطة والتصرفات التي تعرّض الأصول للتلف.</li><li>مراعاة أحكام النظارة والمسؤولية عن التعدي والتفريط.</li></ul>"],
[3,"س12","الأسس الاقتصادية لاستثمار الوقف","<ul><li>عوائد مناسبة لمستوى المخاطر.</li><li>تنويع الاستثمارات.</li><li>إدارة السيولة.</li><li>المحافظة على <b>القيمة الحقيقية</b> للأصول في مواجهة التضخم.</li><li>مراعاة التزامات الوقف واحتياجات المستفيدين.</li></ul>"],
[3,"س13","ماذا تقدم الصناديق الوقفية؟","<ul><li><b>تعبئة المدخرات:</b> إشراك أصحاب المدخرات الصغيرة والمتوسطة.</li><li><b>توسيع المشاركة:</b> خفض الحواجز المالية وتعزيز ثقافة الادخار الوقفي.</li><li><b>تمويل التنمية:</b> تعليم وصحة وإسكان وتأهيل.</li><li><b>الكفاءة:</b> وفورات الحجم، وتنويع المحافظ، وخفض متوسط تكاليف الإدارة.</li></ul>"],
[3,"س14","العائد والمخاطر والسيولة","<ul><li><b>العائد:</b> قدرة الأصول على توليد الإيرادات؛ ويُستعمل معدل العائد على الاستثمار للمقارنة بالبدائل.</li><li><b>المخاطر:</b> تقلب الأسعار، والتعثر الائتماني، وضعف التشغيل، وتراجع القيمة ← تُدار بالتنويع والرقابة.</li><li><b>السيولة:</b> الوفاء بالالتزامات في مواعيدها <b>دون بيع الأصول بشروط غير ملائمة</b>.</li></ul>"],
[3,"س14","الاستدامة والأثر والتقييم الشامل","<ul><li><b>الاستدامة المالية:</b> حفظ الأصول وقيمتها الحقيقية وتدفقات تغطي المصروفات المستقبلية مع الاحتياطيات.</li><li><b>الأثر التنموي:</b> تحسين التعليم والصحة والتوظيف وتخفيف الفقر.</li><li><b>التقييم الشامل:</b> العائد المعدّل بالمخاطر، وكفاءة التشغيل، والسيولة، ونمو الأصول، وتكلفة المنافع، وتحقق الأهداف.</li></ul>"],
[3,"س15","مكونات القطاع الثالث وخصائصه","<b>المكونات:</b> الجمعيات والمؤسسات الأهلية، والمؤسسات الوقفية، والمنظمات الخيرية والتطوعية.<br><b>اقتصاديًا:</b> يوجّه فوائضه لرسالته، وتمويله متنوع (تبرعات، أوقاف، منح، إيرادات مكتسبة، عوائد استثمار).<br><b>مؤسسيًا:</b> أهداف اجتماعية محددة، وهياكل تنظيمية، وحوكمة ومساءلة."],
[3,"س16","التكامل مع القطاعين العام والخاص","<b>مع العام:</b> شراكات في الخدمات، وتبادل البيانات، والاستفادة من الدعم الحكومي، مع احتفاظ الحكومة بدورها <b>التنظيمي والرقابي</b>.<br><b>مع الخاص:</b> المسؤولية الاجتماعية للشركات، والاستثمار الاجتماعي، وتمويل المبادرات، والخبرات الإدارية والتقنية."],
[3,"س17","الدوافع الأربعة للعطاء","<ul><li><b>دينية:</b> الأجر والثواب، والصدقة الجارية، والامتثال.</li><li><b>اقتصادية:</b> تحسين التوزيع، ودعم الخدمات، ومعالجة الفقر؛ ويؤثر الدخل والحوافز.</li><li><b>اجتماعية:</b> التضامن والانتماء، والسمعة والثقة، وممارسات الأسرة.</li><li><b>سلوكية:</b> التعاطف، والأعراف، وطريقة عرض الفرص، وسهولة التبرع، والتغذية الراجعة.</li></ul>"],
[3,"س18","دوافع العطاء بين النظامين","<b>في الاقتصاد الإسلامي:</b> الإيمان بالأجر، والتكافل، والمسؤولية تجاه المجتمع. ويتميز الوقف بربط العطاء <span class='k'>باستمرار المنفعة</span>.<br><b>في النظم الأخرى:</b> الإيثار والتضامن الإنساني، والمسؤولية الاجتماعية، والسمعة، إضافة إلى <span class='k'>الحوافز الضريبية</span>."],
[3,"س19","كفاءة التخصيص وكفاءة الاستخدام","<b>كفاءة التخصيص (أين نضع المورد؟):</b> توجيهه للبرامج الأعلى أثرًا بناءً على الاحتياجات والتكاليف والمنافع و<b>تكلفة الفرصة البديلة</b>.<br><b>كفاءة الاستخدام (كيف نستعمله؟):</b> تحقيق المخرجات بأقل تكلفة، أو تعظيمها بالموارد المتاحة، مع الحفاظ على الجودة."],
[3,"س22","آليات استقرار التمويل","<ol><li>تنويع مصادر التمويل.</li><li>تنمية الأصول الوقفية.</li><li>بناء الاحتياطيات المالية.</li><li>تطوير التمويل الدوري (الاستقطاع والاشتراكات).</li><li>إدارة المخاطر المالية.</li><li>قياس الاستدامة المالية.</li></ol>"],
[3,"س25","أبعاد التنمية المستدامة","<ul><li><b>الاقتصادي:</b> المشروعات الإنتاجية، وريادة الأعمال، والمهارات، وفرص العمل.</li><li><b>الاجتماعي:</b> التعليم والصحة والإسكان والرعاية، وتخفيف الفقر، والعدالة.</li><li><b>البيئي:</b> حماية الموارد الطبيعية، وترشيد المياه والطاقة، والتشجير، والزراعة المستدامة.</li></ul>"],
[3,"س27","آليات معالجة الفقر","<ol><li><b>تخفيف الفقر المعيشي:</b> مساعدات للغذاء والسكن والعلاج.</li><li><b>تنمية رأس المال البشري:</b> التعليم والتدريب والتأهيل.</li><li><b>التمكين الاقتصادي:</b> المشروعات الصغيرة والأسر المنتجة.</li><li><b>الاستدامة التمويلية:</b> عوائد دورية تخفف التأثر بتقلب التبرعات.</li><li><b>كفاءة الاستهداف والتقييم.</b></li></ol>"],
[3,"س29","عوامل نجاح المؤسسات الوقفية","<ol><li>الحوكمة والإدارة المؤسسية.</li><li>الاستدامة المالية.</li><li>التخطيط وقياس الأثر.</li><li>الاستفادة من التجارب المعاصرة.</li><li>الابتكار والشراكات.</li><li>تكييف التجارب الدولية.</li></ol>"],
// ===== المستوى 4 =====
[4,"س1","دليل الكتاب","قال تعالى: <span class='v'>﴿لَن تَنَالُوا الْبِرَّ حَتَّىٰ تُنفِقُوا مِمَّا تُحِبُّونَ﴾</span> [آل عمران: 92].<br>استدل بها الفقهاء على مشروعية الوقف، لأنه إنفاق مما يحبه الإنسان من أصول ماله."],
[4,"س1","حديث عمر في أرض خيبر","حين أصاب عمر بن الخطاب رضي الله عنه أرضًا بخيبر، قال له النبي ﷺ: <span class='v'>«إن شئت حبست أصلها وتصدقت بها»</span> <b>متفق عليه</b>.<br>وهو أصل تعريف الوقف: <b>حبس الأصل</b> + <b>تسبيل المنفعة</b>."],
[4,"س1","حديث الصدقة الجارية","قال ﷺ: <span class='v'>«إذا مات الإنسان انقطع عنه عمله إلا من ثلاثة: إلا من صدقة جارية، أو علم يُنتفع به، أو ولد صالح يدعو له»</span> <b>رواه مسلم</b>.<br>والوقف من أبرز صور الصدقة الجارية."],
[4,"س3","الأنواع باعتبار طبيعة المال","<ul><li><b>عقاري:</b> كالأراضي والمباني.</li><li><b>منقول:</b> كالمعدات والأجهزة.</li><li><b>مالي:</b> كالنقود والأسهم والصكوك.</li></ul>ولكل نوع ضوابطه الشرعية."],
[4,"س3","الأنواع باعتبار المدة والانتفاع","<b>المدة:</b> <b>مؤبد</b> تستمر منافعه بلا تحديد مدة · <b>مؤقت</b> يرتبط بأجل محدد.<br><b>الانتفاع:</b> <b>مباشر</b> تُستخدم أصوله لتقديم الخدمة (كالمستشفيات والمدارس) · <b>استثماري</b> تُوظَّف أصوله لتوليد عوائد تُنفق على المستفيدين."],
[4,"س4","تحويل المقاصد إلى مؤشرات","ترجمة المقاصد إلى أهداف تتطلب <b>مؤشرات قابلة للقياس</b>:<ul><li>العائد الوقفي.</li><li>استدامة التمويل.</li><li>عدد المستفيدين.</li><li>تكلفة تقديم الخدمات.</li><li>مستوى التحسن في أوضاعهم الاقتصادية.</li></ul>"],
[4,"س5","الوقف وإخفاق السوق","يسهم الوقف في تمويل التعليم والصحة والرعاية والمرافق، وتقديم خدمات <b>مجانية أو مدعومة</b>.<br>ويعالج بعض حالات <span class='k'>إخفاق السوق</span>، خصوصًا في الخدمات ذات المنافع الاجتماعية الواسعة، ويعزز العدالة في فرص الانتفاع."],
[4,"س6","لا تخلط: الشرط الواضح والشرط شديد التقييد","<b>الواضح</b> ← يحمي الأصول ويحدد الأولويات ويقلل النزاع.<br><b>شديد التقييد</b> ← قد يحد من <b>المرونة الإدارية والاستثمارية</b>، خصوصًا عند تغير الاحتياجات أو تعطل بعض أوجه الانتفاع.<br>والشرط <b>المخالف للشرع</b> لا اعتبار له أصلًا."],
[4,"س7","الكفاءة الإدارية ومؤشراتها","<b>تتحقق بـ:</b> التخطيط الاستراتيجي، وتحديد الصلاحيات، والحوكمة والشفافية والمساءلة، والكفاءات المتخصصة، والرقابة الداخلية.<br><b>مؤشراتها:</b> العائد على الأصول · نسبة المصروفات الإدارية · معدلات الإشغال والتحصيل · جودة الخدمات · تحقق الأهداف التنموية."],
[4,"س8","التكافل وكفاءة التوزيع","<b>التكافل:</b> تخفيف الأعباء المعيشية، وتوسيع فرص التعليم والرعاية الصحية والسكن للفئات الأكثر احتياجًا.<br><b>الكفاءة الاقتصادية للتوزيع:</b> بناء قواعد بيانات للمستفيدين، والتحقق من الاستحقاق، والحد من <b>ازدواجية الدعم</b>، وقياس أثر الخدمات."],
[4,"س9","لا تخلط: المعلّق والمقيّد","<table><tr><th></th><th>المعلّق</th><th>المقيّد</th></tr><tr><td>محل القيد</td><td>إنشاء الوقف أو نفاذه</td><td>الانتفاع أو الإدارة</td></tr><tr><td>مثال</td><td>«إذا تحقق أمر معين فقد وقفت عقاري»</td><td>تخصيص ريعه لفئة معينة</td></tr><tr><td>الحكم</td><td>مختلف في صحته</td><td>معتبر في حدود المشروعية</td></tr></table>"],
[4,"س10","حفظ القيمة الاقتصادية للأوقاف","آثار الصيغ الحديثة: تنويع الأصول، وتعبئة الموارد، وتوسيع المشاركة، والاستجابة للاحتياجات المتغيرة.<br>وحفظ القيمة يتطلب: إدارة المخاطر، وصيانة الأصول، وتنويع الاستثمارات، و<span class='k'>مراعاة التضخم عند إدارة الأوقاف النقدية</span>."],
[4,"س11","وقف المنقولات","<b>يشمل:</b> المعدات والأجهزة ووسائل النقل والتجهيزات الطبية والتقنية.<br><b>الفرص:</b> توفير أصول تشغيلية للمؤسسات الخيرية وخفض تكاليف خدماتها.<br><b>التحديات:</b> الاستهلاك، والصيانة، و<b>التقادم التقني</b>."],
[4,"س11","وقف الأسهم","<b>يتمثل في:</b> وقف أسهم الشركات المباحة شرعًا، وتوجيه توزيعات أرباحها للأغراض الوقفية.<br><b>الفرص:</b> المشاركة في الأنشطة الإنتاجية وتنويع الاستثمارات.<br><b>التحديات:</b> تقلب الأسعار وتراجع الأرباح ← سياسات استثمارية وإدارة للمخاطر."],
[4,"س11","وقف الصكوك","<b>يقوم على:</b> وقف صكوك استثمارية متوافقة مع الشريعة، وتخصيص عوائدها للمستفيدين.<br><b>الفرص:</b> تدفقات مالية دورية وتنويع المحافظ.<br><b>التحديات:</b> مخاطر <b>الائتمان والسيولة</b> وتغير القيمة السوقية."],
[4,"س11","وقف الحقوق المعنوية","<b>يشمل:</b> الحقوق المالية للملكية الفكرية: حقوق التأليف، وبراءات الاختراع، والبرمجيات.<br><b>الفرص:</b> عوائد عبر الترخيص والاستغلال التجاري.<br><b>التحديات:</b> التقييم، والحماية القانونية، و<b>محدودية مدة بعض الحقوق</b>."],
[4,"س11","متطلبات الصيغ المعاصرة","<ul><li>التحقق من مشروعية الأصول.</li><li>تحديد حقوق الانتفاع.</li><li>تقييم المخاطر.</li><li>الحوكمة والرقابة المالية.</li><li>مراعاة شروط الواقفين.</li></ul>وتنجح بشرط ملاءمة الأدوات لطبيعة الوقف وأهدافه التنموية."],
[4,"س12","التوازن والوفاء بمقاصد الواقفين","<b>التوازن بين المحافظة والتنمية:</b> سياسة استثمارية تحدد الأهداف والمخاطر المقبولة، وتوزيع الموارد بين الأصول، واحتياطيات للصيانة والطوارئ، وإعادة استثمار جزء من العوائد وفق الشروط.<br><b>الوفاء بالمقاصد:</b> توجيه <span class='k'>صافي العوائد القابلة للتوزيع</span> للأغراض المحددة، ومراقبة كفاءة الإنفاق."],
[4,"س13","متطلبات نجاح الصناديق الوقفية","<ul><li>وضوح الأغراض الوقفية.</li><li>حماية حقوق المساهمين والمستفيدين.</li><li>الالتزام بشروط الواقفين.</li><li>الحوكمة والشفافية والإفصاح المالي.</li><li>إدارة المخاطر وقياس الأداء.</li></ul>والفكرة المحورية: تحويل المدخرات الفردية المتفرقة إلى موارد وقفية منظمة."],
[4,"س15","موقع الوقف في القطاع الثالث ودوره","<b>الأوقاف</b> مكوّن أساسي يتميز <span class='k'>بامتلاك أصول مخصصة</span> لتوليد منافع مستمرة، أما <b>المؤسسات الخيرية</b> فأنشطتها بين المساعدات المباشرة والبرامج التنموية.<br><b>دور القطاع:</b> استكمال الخدمات الحكومية والتجارية، وتعزيز التكافل، وتنمية رأس المال البشري والاجتماعي."],
[4,"س16","أثر التكامل وشروط الشراكة","<b>في التخصيص:</b> توجيه الموارد للأولويات، وتقليل ازدواجية البرامج، ووفورات الحجم.<br><b>في الخدمات:</b> توسيعها للفئات والمناطق الأقل استفادة.<br><b>شروط الشراكة:</b> وضوح الأدوار، وأهداف مشتركة، وحوكمة، وقياس النتائج. والقيمة تتحقق حين يتفوق التعاون على <b>العمل المنفرد</b>."],
[4,"س17","حجم العطاء واستمراريته","<b>حجمه يتأثر بـ:</b> القدرة المالية · قوة الدوافع · الثقة بالمؤسسات.<br><b>استمراريته ترتبط بـ:</b> الالتزام الشخصي · وضوح الأثر · سهولة المساهمة الدورية · استقرار العلاقة بالمؤسسة.<br><b>أدوات التعبئة:</b> الاستقطاع الدوري، والوقف الجماعي، والإفصاح عن الأثر."],
[4,"س18","آليات التمويل والاستدامة","<b>الإسلامي:</b> الزكاة، والصدقات، والهبات، والأوقاف، والصناديق الوقفية.<br><b>الأخرى:</b> تبرعات فردية ومؤسسية، ومنح حكومية، ومؤسسات مانحة، ووصايا خيرية، وصناديق استثمارية خيرية، وإيرادات مكتسبة.<br><b>الاستدامة:</b> ذات الأصول الاستثمارية ← إيرادات مستمرة · التبرعات والمنح ← تتأثر بتقلب الظروف وأولويات المانحين."],
[4,"س19","مؤشرات الكفاءة وأدوات التقييم","<b>المؤشرات:</b> تكلفة الخدمة لكل مستفيد، ونسبة المصروفات الإدارية والتشغيلية، ومعدل استغلال الأصول، والإنتاجية، ونسبة تحقيق المستهدفات، ورضا المستفيدين.<br><b>الأدوات:</b> تحليل التكلفة والمنفعة، وتحليل فاعلية التكلفة، والمقارنة المرجعية، وتحليل كفاءة الأداء، والعائد الاجتماعي على الاستثمار."],
[4,"س19","متطلبات تحسين الكفاءة","<ul><li>التخطيط المبني على الاحتياجات.</li><li>تطوير قواعد البيانات.</li><li>الحوكمة والرقابة.</li><li>رفع كفاءة العاملين.</li><li>التحول الرقمي.</li><li>التقييم الدوري للبرامج.</li></ul>"],
[4,"س20","التكافل وإعادة توزيع الدخل والثروة","<b>التكافل:</b> توفير التعليم والصحة والسكن والغذاء والرعاية للمحتاجين.<br><b>توزيع الدخل:</b> تحويل جزء من الموارد للمستفيدين نقدًا أو عينًا، فتزيد قدرتهم الشرائية.<br><b>توزيع منافع الثروة:</b> تخصيص <b>أصول منتجة</b> يستفيد المستفيدون من عوائدها عبر الأجيال مع بقاء الأصل."],
[4,"س20","آثار التكافل ومتطلبات فاعليته","<b>الآثار:</b> دعم استهلاك الأسر محدودة الدخل، وتحسين الوصول للخدمات، وتنمية رأس المال البشري، والاستقرار الاجتماعي.<br><b>متطلبات الفاعلية:</b> دقة تحديد المستحقين، والتوجيه وفق الاحتياج الفعلي، والعدالة، وتجنب ازدواجية الدعم، وقياس التحسن."],
[4,"س21","كيف يدعم الوقف شبكة الأمان؟","<ol><li><b>الحماية الاجتماعية:</b> مساعدات نقدية وعينية وصحة وتعليم وإسكان.</li><li><b>استقرار الموارد:</b> الأوقاف الاستثمارية مصدر تمويل مستمر نسبيًا.</li><li><b>مواجهة الصدمات:</b> دعم المتضررين من الأزمات والكوارث.</li><li><b>التكامل مع البرامج الحكومية:</b> توسيع التغطية وتحسين الاستهداف.</li><li><b>الاستدامة:</b> تنويع التمويل والاحتياطيات والبيانات.</li></ol>"],
[4,"س22","مؤشرات قياس الاستدامة المالية","<ul><li>نسبة تغطية المصروفات التشغيلية <b>بالإيرادات المتكررة</b>.</li><li><b>عدد أشهر الاحتياطي النقدي</b>.</li><li>درجة تنوع مصادر التمويل.</li><li>استقرار التدفقات النقدية.</li></ul>ومن أدوات إدارة المخاطر: الموازنات التقديرية و<b>اختبار السيناريوهات</b>."],
[4,"س23","الآثار على مستوى الاقتصاد الجزئي","<ul><li><b>الأفراد:</b> تخفيف القيود المالية والاستثمار في التعليم.</li><li><b>الأسر:</b> زيادة الدخل المتاح وتخفيف أعباء الصحة والتعليم والسكن.</li><li><b>المنشآت:</b> دعم المشروعات الصغيرة بالتمويل والتدريب.</li><li><b>تخصيص الموارد:</b> معالجة إخفاق السوق عند الآثار الخارجية الإيجابية.</li></ul>"],
[4,"س24","الآثار على المتغيرات الكلية","<ul><li><b>الاستهلاك:</b> التحويلات للأسر محدودة الدخل ترفع الطلب لأنها تنفق نسبة مرتفعة من دخلها الإضافي.</li><li><b>الادخار:</b> تحويل الثروات إلى أصول منتجة للمنافع.</li><li><b>الاستثمار:</b> تكوين رأس المال وتوسيع الطاقة الإنتاجية.</li><li><b>التشغيل:</b> فرص مباشرة وغير مباشرة.</li><li><b>النمو:</b> رأس المال البشري والإنتاجية.</li></ul>"],
[4,"س23–س24","لا تخلط: الجزئي والكلي","<b>الجزئي</b> ← سلوك <b>الوحدات</b>: الفرد والأسرة والمنشأة وقراراتها في الاستهلاك والادخار والإنتاج.<br><b>الكلي</b> ← <b>المتغيرات المجمّعة</b>: الاستهلاك الكلي، والادخار، والاستثمار، والتشغيل، والنمو.<br>والمحصلة الكلية تتأثر بمصادر التمويل وآثارها على <span class='k'>الإنفاق البديل</span>."],
[4,"س25","أولويات التنمية ومؤشراتها","<b>المجالات ذات الأولوية:</b> رأس المال البشري، والصحة، والتأهيل المهني، والإسكان الاجتماعي، والمشروعات الصغيرة، والأمن المائي والغذائي، والبيئة.<br><b>تُحدد بـ:</b> حجم الاحتياج، والعائد الاجتماعي، وكفاءة الاستخدام.<br><b>المؤشرات:</b> الوظائف المستحدثة، وتحسن الدخل، والتحصيل، وجودة الصحة، واستمرارية المنافع."],
[4,"س26","مؤشرات قياس الأثر وأساليبه","<b>المؤشرات الاقتصادية:</b> الموارد المستثمرة، والعوائد، وتكلفة الخدمة، والوظائف، وتغير الدخل.<br><b>الاجتماعية:</b> التحصيل، والصحة، والمعيشة، والاعتماد الذاتي.<br><b>الأساليب:</b> التكلفة والمنفعة، وفاعلية التكلفة، والعائد الاجتماعي، والدراسات الطولية، والتقييمات التجريبية وشبه التجريبية.<br>ويلزم <span class='k'>خط أساس</span> وبيانات موثوقة."],
[4,"س27","معادلة معالجة الفقر","<b>حماية اجتماعية قصيرة الأجل</b> (مساعدات للحاجات الأساسية)<br>+ <b>تمكين إنتاجي طويل الأجل</b> (تعليم وتدريب ومشروعات صغيرة)<br>= تحسين الدخول، والاستقلال المالي، والاستقرار المعيشي.<br>والقياس: التغير في الدخل والاستهلاك والتوظيف و<b>الاعتماد على المساعدات</b>."],
[4,"س28","توليد فرص العمل","<ul><li><b>مباشرة:</b> وظائف في الإدارة والاستثمار والتعليم والصحة والخدمات.</li><li><b>غير مباشرة:</b> تنشيط الأنشطة المرتبطة وزيادة الطلب وتشغيل المنشآت المتعاقدة والموردة.</li><li><b>التدريب والتأهيل:</b> برامج متوافقة مع سوق العمل في المهارات الفنية والرقمية والإدارية.</li></ul>"],
[4,"س28","دعم المشروعات وقياس أثر التشغيل","<b>دعم المشروعات:</b> تمويل وأصول ومعدات واستشارات للمشروعات الصغيرة والأسر المنتجة.<br><b>الشراكات:</b> مع القطاع الخاص والجهات التعليمية لربط المستفيدين بالوظائف.<br><b>القياس:</b> الوظائف المستحدثة، ونسبة توظيف المتدربين، واستمرارية الوظائف، ونمو الدخول، و<b>معدلات بقاء المشروعات</b>."],
[4,"س29","التجارب المعاصرة وتكييفها","<b>المحلية:</b> نماذج في إدارة الأصول والصناديق الوقفية.<br><b>الدول المتقدمة:</b> <span class='k'>المؤسسات المانحة والأوقاف الجامعية</span>: خبرات في الاستثمار المؤسسي وتنويع المحافظ وإدارة المنح.<br><b>التكييف:</b> مراعاة الأحكام الشرعية والأنظمة المحلية وتقييم قابلية نقل الممارسات."],
[4,"س30","كفايات العاملين وقيمهم","<ul><li><b>علمية:</b> أحكام الوقف، والمبادئ الاقتصادية، والاستثمار، وتحليل الاحتياجات.</li><li><b>مهنية:</b> التخطيط، والإدارة المالية، والمخاطر، والحوكمة، والموازنات، والتقنية.</li><li><b>قيم:</b> الأمانة، والنزاهة، والشفافية، والمساءلة، واحترام الشروط، وترشيد الموارد.</li><li><b>التطوير:</b> التعلم الإلكتروني ودراسة الحالات والمحاكاة، والتدريب والشهادات المهنية.</li></ul>"],
[4,"الخاتمة","الخلاصة الجامعة للمقرر","تتحقق فاعلية مؤسسات الوقف والعمل الخيري بالجمع بين:<ol><li><b>الحوكمة الرشيدة</b>.</li><li><b>الكفاءة الاستثمارية</b>.</li><li><b>الابتكار المؤسسي</b>.</li><li><b>قياس الأثر</b>.</li></ol>مع كفاءات بشرية تجمع المعرفة الشرعية والاقتصادية والقيم المهنية؛ بما يرسّخ مكانتها في القطاع الثالث ويعزز دورها في التنمية."]
];

</script>
<script>
(function(){
const KEY=COURSE.slug+'-cards-v1';
const cards=[];const cnt={};
C.forEach(c=>{cnt[c[0]]=(cnt[c[0]]||0)+1;cards.push({lv:c[0],id:'L'+c[0]+'-'+cnt[c[0]],ch:c[1],t:c[2],b:c[3]});});
LEVELS.forEach(l=>{l.cards=cards.filter(c=>c.lv===l.n);l.total=l.cards.length;});
window.LEVELS_INFO=LEVELS.map(l=>l.total);
const byId={};cards.forEach(c=>byId[c.id]=c);
const ALL=cards.map(c=>c.id);
let S={done:{},level:1,order:{},cur:null};
function load(){try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);S=Object.assign(S,o);S.done=S.done||{};S.order=S.order||{};}}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
const B64='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_';
function enc(){let s='';for(let i=0;i<ALL.length;i+=6){let v=0;for(let j=0;j<6;j++){if(S.done[ALL[i+j]])v|=1<<j;}s+=B64[v];}return s;}
function dec(p){const d={};for(let i=0;i<p.length;i++){const v=B64.indexOf(p[i]);if(v<0)continue;for(let j=0;j<6;j++){if(v&(1<<j)&&ALL[i*6+j])d[ALL[i*6+j]]=1;}}return d;}
function nDone(list){return list.filter(c=>S.done[c.id]).length;}
function getOrder(n){const L=LEVELS[n-1];let o=S.order[n];if(!o||o.length!==L.total||o.some(id=>!byId[id]))o=L.cards.map(c=>c.id);S.order[n]=o;return o;}
let hist=[];let view='card';
function nextCard(n){const o=getOrder(n);return o.find(id=>!S.done[id])||null;}
function linkURL(){return location.href.split('#')[0]+'#p='+enc()+'&l='+S.level+(S.cur?'&c='+S.cur:'');}
function syncURL(){try{history.replaceState(null,'','#p='+enc()+'&l='+S.level+(S.cur?'&c='+S.cur:''));}catch(e){}}
const $=id=>document.getElementById(id);
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),1400);}
function header(){
 const d=nDone(cards);$('totTxt').textContent=d+' / '+cards.length;$('totBar').style.width=(100*d/cards.length)+'%';
 $('levels').innerHTML=LEVELS.map(l=>{const k=nDone(l.cards);return `<button class="lv${l.n===S.level?' on':''}" data-l="${l.n}">${k===l.total?'<span class="done">✓</span>':''}<b>المستوى ${l.n}</b><span>${l.name}</span><span>${k} / ${l.total}</span><div class="bar"><i style="width:${100*k/l.total}%"></i></div></button>`;}).join('');
 document.querySelectorAll('.lv').forEach(b=>b.onclick=()=>goLevel(+b.dataset.l));
}
function render(){
 header();const L=LEVELS[S.level-1];const st=$('stage');
 if(view==='fin'){
  const last=S.level===LEVELS.length;
  st.innerHTML=`<div class="fin"><div class="big">🎉</div><h2>${last&&nDone(cards)===cards.length?'أتممت المقرر كله!':'أتممت المستوى '+S.level+': '+L.name}</h2><p>${last?'أنجزت بطاقات المستوى الأخير. راجع ما شئت من المستويات متى أردت.':'أحسنت! انتقل إلى المستوى التالي لتتعمق أكثر.'}</p>${last?'':'<button class="pri" id="goNext">انتقل إلى المستوى التالي</button>'}<button id="review">راجع بطاقات هذا المستوى</button></div>`;
  if(!last)$('goNext').onclick=()=>goLevel(S.level+1);
  $('review').onclick=()=>{S.cur=getOrder(S.level)[0];view='card';hist=[];save();render();};
  S.cur=null;syncURL();return;}
 if(!S.cur||!byId[S.cur]||byId[S.cur].lv!==S.level){S.cur=nextCard(S.level);if(!S.cur){view='fin';return render();}}
 const c=byId[S.cur];const o=getOrder(S.level);const idx=L.cards.findIndex(x=>x.id===c.id)+1;const left=L.total-nDone(L.cards);const dn=!!S.done[c.id];
 st.innerHTML=`<div class="card" id="cardEl"><div class="meta"><span class="ch">${c.ch}</span><span>المستوى ${S.level} · بطاقة ${idx} من ${L.total}${dn?' · <span class="isdone">✓ منجزة</span>':''}</span></div><h2>${c.t}</h2><div class="body">${c.b}</div></div>
 <div class="actions"><button id="ok">✓ تم، فهمتها</button><button id="later">${dn?'إلغاء تم':'لاحقًا'}</button></div>
 <div class="sub"><a id="prev" style="${hist.length?'':'visibility:hidden'}">→ السابقة</a><span>بقي ${left} في هذا المستوى</span></div>`;
 $('ok').onclick=()=>{S.done[c.id]=1;hist.push(c.id);toast('أحسنت ✓');advance();};
 $('later').onclick=()=>{if(dn){delete S.done[c.id];save();render();return;}const a=getOrder(S.level).filter(x=>x!==c.id);a.push(c.id);S.order[S.level]=a;hist.push(c.id);advance(c.id);};
 $('prev').onclick=()=>{if(!hist.length)return;S.cur=hist.pop();save();render();};
 save();syncURL();
}
function advance(skip){const o=getOrder(S.level);const n=o.find(id=>!S.done[id]&&id!==skip)||(skip&&!S.done[skip]?skip:null);if(!n){view='fin';S.cur=null;}else{S.cur=n;view='card';}save();render();window.scrollTo({top:0,behavior:'smooth'});}
function goLevel(n){S.level=n;view='card';hist=[];S.cur=nextCard(n);if(!S.cur)view='fin';save();render();closeSheet();}
function openSheet(){const L=LEVELS[S.level-1];$('shTitle').textContent='المستوى '+L.n+' · '+L.name;
 $('shList').innerHTML=L.cards.map((c,i)=>`<div class="it${S.done[c.id]?' d':''}${c.id===S.cur?' cur':''}" data-id="${c.id}"><span class="st">${S.done[c.id]?'✓':''}</span><span>${i+1}. ${c.t}</span><small>${c.ch}</small></div>`).join('');
 document.querySelectorAll('.it').forEach(e=>e.onclick=()=>{S.cur=e.dataset.id;view='card';save();render();closeSheet();});
 $('confirm').style.display='none';$('sheet').classList.add('open');$('sheetBg').classList.add('open');}
function closeSheet(){$('sheet').classList.remove('open');$('sheetBg').classList.remove('open');}
$('menuBtn').onclick=openSheet;$('shClose').onclick=closeSheet;$('sheetBg').onclick=closeSheet;
$('resetBtn').onclick=()=>{$('confirm').style.display='block';};$('resetNo').onclick=()=>{$('confirm').style.display='none';};
$('resetYes').onclick=()=>{LEVELS[S.level-1].cards.forEach(c=>delete S.done[c.id]);delete S.order[S.level];hist=[];S.cur=null;view='card';save();render();closeSheet();toast('أُعيد تعيين المستوى');};
$('shareBtn').onclick=()=>{const u=linkURL();const fb=()=>{try{const t=document.createElement('textarea');t.value=u;document.body.appendChild(t);t.select();const ok=document.execCommand('copy');t.remove();if(ok){toast('نُسخ الرابط ✓');return;}}catch(e){}prompt('انسخ رابط تقدّمك:',u);};
 if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(u).then(()=>toast('نُسخ الرابط ✓'),fb);else fb();};
// init
$('ttl').textContent=COURSE.title;
load();
const h=new URLSearchParams(location.hash.slice(1));
if(h.get('p')){const saved=nDone(cards);const d=dec(h.get('p'));const k=Object.keys(d).length;Object.assign(S.done,d);
 if(k>=saved){const l=+h.get('l');if(l>=1&&l<=LEVELS.length)S.level=l;const c=h.get('c');S.cur=(c&&byId[c]&&byId[c].lv===S.level)?c:null;}}
if(S.cur&&!byId[S.cur])S.cur=null;
render();
})();
</script></body></html>
